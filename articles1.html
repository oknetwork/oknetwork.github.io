<!DOCTYPE HTML>
<html>
	<head>
		<title>theOkNetwork | Industry Articles & Insights</title>
		<link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico"/>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Latest insights on AI, Cybersecurity, Compliance, and Cloud Operations." />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
            /* Clean up the Feed output */
            #divRss { text-align: left; margin: 0 auto; max-width: 800px; }
            .itemTitle a { font-weight: bold; font-size: 1.2em; color: #333; text-decoration: none; }
            .itemTitle a:hover { color: #007bff; }
            .itemDate { font-size: 0.9em; color: #888; margin-bottom: 0.5em; }
            .itemContent { font-size: 1em; line-height: 1.6; margin-bottom: 2em; padding-bottom: 1em; border-bottom: 1px solid #eee; }
        </style>
	</head>
	<body>
		<div id="header-bar1" class="reveal alt">
			<nav id="nav1">
				<ul class="topnav" id="myTopnav" style="margin-bottom: 0;">
					<li style="-moz-user-select: none; cursor: pointer; white-space: nowrap;" class="submenu opener">
						<ul style="-moz-user-select: none; display: none; position: absolute;"></ul>
					</li>
					<li style="white-space: nowrap;"><a href="articles1.html" style="font-weight: 900;">Articles</a></li>
					<li style="white-space: nowrap;"><a href="index.html" style="font-weight: 900;">Home</a></li>
				</ul>
			</nav>
		</div>

		<section id="header">
			<header class="major">
				<h1>Industry Insights</h1>
				<p>Curated news and analysis on AI, Cybersecurity, Compliance, and Operations.</p>
			</header>
			<div class="container">
				<ul class="actions">
					<li><a href="#one" class="button special scrolly">Read Latest</a></li>
				</ul>
			</div>
		</section>

		<section id="one" class="main special">
			<div class="container">
				<div class="content">
					<header class="major">
						<h2>Latest Threat Intel & Tech News</h2>
					</header>
					
					<div id="divRss">
						<p><em>Loading latest articles...</em></p>
					</div>

				</div>
			</div>
		</section>

		<section id="footer">
			<div class="container">
				<header class="major">
					<h2>Contact Us</h2>
				</header>
				<form method="post" action="mailto:ok@theoknetwork.com">
					<div class="row uniform">
						<div class="6u 12u$(xsmall)"><input type="text" name="name" id="name" placeholder="Name" /></div>
						<div class="6u$ 12u$(xsmall)"><input type="email" name="email" id="email" placeholder="Email" /></div>
						<div class="12u$"><textarea name="message" id="message" placeholder="Message" rows="4"></textarea></div>
						<div class="12u$">
							<ul class="actions">
								<li><input type="submit" value="Send Message" class="special" /></li>
							</ul>
						</div>
					</div>
				</form>
			</div>
			<footer>
				<ul class="icons">
					<li><a href="mailto:ok@theoknetwork.com" class="icon alt fa-envelope"><span class="label">Email</span></a></li>
				</ul>
				<ul class="copyright">
					<li>&copy; theoknetwork.com 2026</li>
				</ul>
			</footer>
		</section>

		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
		
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/skel.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

		<script type="text/javascript" src="FeedEk-master/js/FeedEk.min.js"></script>
		<script type="text/javascript">
			$(document).ready(function () {
				$('#divRss').FeedEk({
					FeedUrl: 'https://cyberthreatinfo.github.io/feed.xml', 
					MaxCount: 10,
					ShowDesc: true,
					ShowPubDate: true,
					DescCharacterLimit: 250
				});
			});
		</script>
	</body>
</html>
